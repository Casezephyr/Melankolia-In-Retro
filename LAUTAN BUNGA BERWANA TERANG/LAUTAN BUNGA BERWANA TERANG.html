<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie Run - Dongker Edition</title>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
    }
    body {
        /* Background langit satu gambar penuh tanpa duplikat */
        background-image: url('LANGIT.png');
        background-repeat: no-repeat;
        background-position: center center;
        background-size: cover;
        background-attachment: fixed;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: 'Press Start 2P', monospace, sans-serif;
        color: white;
        overflow: hidden;
    }
    #game-container {
        position: relative;
        border: 4px solid #ffffff;
        box-shadow: 0 0 0 4px #000000, 0 10px 30px rgba(0,0,0,0.8);
    }
    
    canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
    }

    #ui-layer {
        position: absolute;
        top: 15px;
        left: 0;
        width: 100%;
        padding: 0 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        pointer-events: none;
        z-index: 10;
    }

    .hud-badge {
        background: #e74c3c;
        border: 4px solid #000;
        box-shadow: inset -4px -4px 0px 0px #900c3f, inset 4px 4px 0px 0px #ff7675;
        padding: 8px 12px;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .hud-icon {
        font-size: 16px;
    }
    .hud-value {
        font-size: 14px;
        color: #fff;
        text-shadow: 2px 2px 0px #000;
    }

    .score-box {
        background: #f1c40f;
        border: 4px solid #000;
        box-shadow: inset -4px -4px 0px 0px #d35400, inset 4px 4px 0px 0px #f39c12;
        padding: 8px 16px;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .coin-icon {
        font-size: 14px;
    }
    .score-text {
        font-size: 14px;
        color: #000;
        text-shadow: none;
    }

    /* POPUP OVERLAY SCREEN */
    .screen-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 20;
    }
    .hidden {
        display: none !important;
    }
    
    .popup-card {
        background: #2c3e50;
        border: 4px solid #fff;
        box-shadow: 0 0 0 4px #000, inset -6px -6px 0px 0px #1a252f, inset 6px 6px 0px 0px #34495e;
        padding: 30px;
        text-align: center;
        max-width: 600px;
        width: 90%;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* LOGO GAMBAR DI MENU START */
    .start-logo-img {
        width: 100%;
        max-width: 480px;
        height: auto;
        margin-bottom: 20px;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.8));
    }

    .popup-title {
        font-size: 20px;
        color: #e74c3c;
        text-shadow: 3px 3px 0px #000;
        margin-bottom: 20px;
        letter-spacing: -1px;
    }
    .stats-container {
        background: #000;
        border: 4px solid #576574;
        padding: 15px;
        margin: 20px 0;
        width: 100%;
    }
    .stat-row {
        font-size: 10px;
        color: #bdc3c7;
        margin-bottom: 10px;
        line-height: 1.4;
    }
    .stat-value {
        color: #f1c40f;
        font-size: 16px;
        text-shadow: 2px 2px 0px #000;
    }

    .btn-play {
        padding: 14px 28px;
        font-size: 12px;
        font-family: 'Press Start 2P', monospace;
        background: #2ecc71;
        color: #000;
        border: 4px solid #000;
        box-shadow: inset -4px -4px 0px 0px #27ae60, inset 4px 4px 0px 0px #58d68d;
        cursor: pointer;
        margin-top: 10px;
    }
    .btn-play:hover {
        background: #58d68d;
        transform: scale(1.02);
    }
    .btn-play:active {
        box-shadow: inset 4px 4px 0px 0px #27ae60;
        transform: translateY(2px);
    }
</style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="1000" height="500"></canvas>
    
    <!-- UI HUD -->
    <div id="ui-layer">
        <div class="hud-badge">
            <div class="hud-icon">🧟</div>
            <div class="hud-value"><span id="zombie-count">1</span></div>
        </div>

        <div class="score-box">
            <div class="coin-icon">🪙</div>
            <div class="score-text"><span id="score-count">0</span> m</div>
        </div>
    </div>

    <!-- LAYAR START -->
    <div id="start-screen" class="screen-overlay">
        <div class="popup-card">
            <!-- LOGO.png DITAMBAHKAN DI SINI -->
            <img src="LOGO.png" alt="Lautan Bunga Berwarna Terang" class="start-logo-img">
            
            <p style="font-size: 9px; color: #f1f2f6; line-height: 1.8;">"Malam-malam ini kita semua bertemu,<br>merayakan hidup yang harus dirayakan."</p>
            
            <div class="stats-container">
                <div class="stat-row">KONTROL</div>
                <div style="font-size: 9px; color: #2ecc71; line-height: 1.6;">SPASI / PANAH ATAS / TAP LAYAR</div>
            </div>

            <button class="btn-play" onclick="startGame()">MENARI LIAR</button>
        </div>
    </div>

    <!-- LAYAR GAME OVER -->
    <div id="game-over-screen" class="screen-overlay hidden">
        <div class="popup-card">
            <h1 class="popup-title">DUNIA MENYANGKALNYA</h1>
            <p style="font-size: 9px; color: #f1f2f6; line-height: 1.6;">"Kutemukan dasarnya yang tajam,<br>lalu berusaha hidup lagi."</p>
            
            <div class="stats-container">
                <div class="stat-row">JARAK TEMPUH</div>
                <div class="stat-value"><span id="final-score">0</span> METER</div>
            </div>

            <button class="btn-play" onclick="startGame()">BERUSAHA HIDUP LAGI</button>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const zombieCountEl = document.getElementById('zombie-count');
const scoreCountEl = document.getElementById('score-count');
const startScreen = document.getElementById('start-screen');
const gameOverScreen = document.getElementById('game-over-screen');
const finalScoreEl = document.getElementById('final-score');

const groundY = 360;

// AUDIO BGM
const bgm = new Audio();
bgm.src = 'BGM.mp3';
bgm.loop = true; 

const spriteSets = [
    ['A1.png', 'A2.png', 'A3.png'],
    ['B1.png', 'B2.png', 'B3.png'],
    ['C1.png', 'C2.png', 'C3.png'],
    ['D1.png', 'D2.png', 'D3.png']
];

const loadedSprites = spriteSets.map(set => set.map(src => {
    const img = new Image();
    img.src = src;
    return img;
}));

const bgImage = new Image();
bgImage.src = 'LANGIT.png';

const roadImage = new Image();
roadImage.src = 'JALAN.png';

const foregroundImage = new Image();
foregroundImage.src = 'JALAN LAYER DEPAN.png';

const iblisImage = new Image();
iblisImage.src = 'IBLIS.png';

const recruitSprites = ['W1.png', 'W2.png'].map(src => {
    const img = new Image();
    img.src = src;
    return img;
});

let gameSpeed = 6;
let score = 0;
let isGameOver = false;
let isGameStarted = false;
let animationFrameId;
let globalTick = 0;
let roadX = 0;

class Character {
    constructor(typeIndex, xOffset) {
        this.typeIndex = typeIndex;
        this.height = 75 + Math.random() * 6;
        this.relX = xOffset;
        this.relY = Math.random() * 6 - 3;
        this.animOffset = Math.floor(Math.random() * 6);
    }

    draw(baseX, baseY) {
        const frameIndex = Math.floor((globalTick + this.animOffset) / 5) % 3;
        const currentImg = loadedSprites[this.typeIndex][frameIndex];
        
        const renderX = baseX - this.relX;
        const renderY = baseY + this.relY - this.height + 15;

        if (currentImg.complete && currentImg.naturalWidth !== 0) {
            const aspectRatio = currentImg.naturalWidth / currentImg.naturalHeight;
            const drawWidth = this.height * aspectRatio;

            ctx.drawImage(currentImg, renderX, renderY, drawWidth, this.height);
        } else {
            ctx.fillStyle = '#4caf50';
            ctx.fillRect(renderX, baseY - this.height, 50, this.height);
        }
    }
}

class Horde {
    constructor() {
        this.x = 220;
        this.y = groundY;
        this.velocityY = 0;
        this.gravity = 0.65;
        this.jumpPower = -14;
        this.isGrounded = true;
        this.members = [new Character(0, 0)];
        this.currentOffset = 0;
    }

    addMember() {
        const randomType = Math.floor(Math.random() * spriteSets.length);
        this.currentOffset += Math.random() * 18 + 20; 
        this.members.push(new Character(randomType, this.currentOffset));
    }

    removeMember() {
        if (this.members.length > 1) {
            this.members.pop();
            this.currentOffset = this.members[this.members.length - 1].relX;
        } else {
            this.members.pop();
            this.currentOffset = 0;
        }
    }

    jump() {
        if (this.isGrounded) {
            this.velocityY = this.jumpPower;
            this.isGrounded = false;
        }
    }

    update() {
        this.velocityY += this.gravity;
        this.y += this.velocityY;

        if (this.y >= groundY) {
            this.y = groundY;
            this.velocityY = 0;
            this.isGrounded = true;
        }
    }

    draw() {
        for (let i = this.members.length - 1; i >= 0; i--) {
            this.members[i].draw(this.x, this.y);
        }
    }
}

class RecruitItem {
    constructor() {
        this.x = canvas.width + Math.random() * 200;
        this.height = 75;
        this.width = 50;  
        this.markedForDeletion = false;
    }

    update() {
        this.x -= gameSpeed;
        if (this.x + this.width < 0) this.markedForDeletion = true;
    }

    draw() {
        const frameIndex = Math.floor(globalTick / 10) % 2;
        const img = recruitSprites[frameIndex];
        
        if (img.complete && img.naturalWidth !== 0) {
            const aspectRatio = img.naturalWidth / img.naturalHeight;
            this.width = this.height * aspectRatio;
            const renderY = groundY - this.height + 15;

            ctx.drawImage(img, this.x, renderY, this.width, this.height);
        } else {
            ctx.fillStyle = '#ffb74d';
            ctx.fillRect(this.x, groundY - this.height, 45, this.height);
        }
    }
}

class DemonObstacle {
    constructor() {
        this.x = canvas.width + Math.random() * 150;
        this.height = 85;
        this.width = 65;
        this.markedForDeletion = false;
        this.hasHit = false;
    }

    update() {
        this.x -= gameSpeed;
        if (this.x + this.width < 0) this.markedForDeletion = true;
    }

    draw() {
        if (iblisImage.complete && iblisImage.naturalWidth !== 0) {
            const aspectRatio = iblisImage.naturalWidth / iblisImage.naturalHeight;
            this.width = this.height * aspectRatio;
            const renderY = groundY - this.height + 15;

            ctx.drawImage(iblisImage, this.x, renderY, this.width, this.height);
        } else {
            ctx.fillStyle = '#d32f2f';
            ctx.fillRect(this.x, groundY - this.height, 55, this.height);
        }
    }
}

let horde;
let recruits = [];
let demons = [];
let spawnTimer = 0;

function init() {
    horde = new Horde();
    recruits = [];
    demons = [];
    score = 0;
    gameSpeed = 6;
    globalTick = 0;
    roadX = 0;
    isGameOver = false;
    
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');

    if (bgm.paused) {
        bgm.play().catch(() => {});
    }
}

function drawBackground() {
    if (bgImage.complete && bgImage.naturalWidth !== 0) {
        ctx.drawImage(bgImage, 0, 0, canvas.width, groundY);
    } else {
        ctx.fillStyle = '#70c5ce';
        ctx.fillRect(0, 0, canvas.width, groundY);
    }

    const roadHeight = canvas.height - groundY;
    if (roadImage.complete && roadImage.naturalWidth !== 0) {
        const aspectRatio = roadImage.naturalWidth / roadImage.naturalHeight;
        const scaledWidth = roadHeight * aspectRatio;
        
        roadX = (roadX - gameSpeed) % scaledWidth;

        for (let x = roadX; x < canvas.width + scaledWidth; x += scaledWidth) {
            ctx.drawImage(roadImage, x, groundY, scaledWidth, roadHeight);
        }
    } else {
        ctx.fillStyle = '#444';
        ctx.fillRect(0, groundY, canvas.width, roadHeight);
    }
}

function drawForeground() {
    const roadHeight = canvas.height - groundY;
    if (foregroundImage.complete && foregroundImage.naturalWidth !== 0) {
        const aspectRatio = foregroundImage.naturalWidth / foregroundImage.naturalHeight;
        const scaledWidth = roadHeight * aspectRatio;

        for (let x = roadX; x < canvas.width + scaledWidth; x += scaledWidth) {
            ctx.drawImage(foregroundImage, x, groundY - 12, scaledWidth, roadHeight + 12);
        }
    }
}

function spawnObstacles() {
    spawnTimer++;
    if (spawnTimer % 100 === 0) {
        if (Math.random() < 0.55) {
            recruits.push(new RecruitItem());
        } else {
            demons.push(new DemonObstacle());
        }
    }
}

function checkCollisions() {
    recruits.forEach(recruit => {
        if (!recruit.markedForDeletion &&
            horde.x - horde.currentOffset < recruit.x + recruit.width &&
            horde.x + 40 > recruit.x &&
            horde.y - 80 < groundY) {
            
            recruit.markedForDeletion = true;
            horde.addMember();
        }
    });

    demons.forEach(demon => {
        if (!demon.hasHit &&
            horde.x + 35 > demon.x && 
            horde.x - horde.currentOffset < demon.x + demon.width &&
            horde.y >= groundY - 30) {
            
            demon.hasHit = true;
            horde.removeMember();
            
            if (horde.members.length <= 0) {
                endGame();
            }
        }
    });
}

function updateUI() {
    zombieCountEl.textContent = horde.members.length;
    scoreCountEl.textContent = Math.floor(score / 10);
}

function endGame() {
    isGameOver = true;
    finalScoreEl.textContent = Math.floor(score / 10);
    gameOverScreen.classList.remove('hidden');
}

function gameLoop() {
    if (isGameOver) return;

    globalTick++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawBackground();

    horde.update();
    horde.draw();

    spawnObstacles();

    recruits.forEach((recruit, index) => {
        recruit.update();
        recruit.draw();
        if (recruit.markedForDeletion) recruits.splice(index, 1);
    });

    demons.forEach((demon, index) => {
        demon.update();
        demon.draw();
        if (demon.markedForDeletion) demons.splice(index, 1);
    });

    drawForeground();

    checkCollisions();

    score++;
    gameSpeed += 0.0008;

    updateUI();

    animationFrameId = requestAnimationFrame(gameLoop);
}

function startGame() {
    cancelAnimationFrame(animationFrameId);
    isGameStarted = true;
    init();
    gameLoop();
}

function drawIdleState() {
    drawBackground();
    drawForeground();
}

window.addEventListener('keydown', (e) => {
    if ((e.code === 'Space' || e.code === 'ArrowUp') && isGameStarted && !isGameOver) {
        horde.jump();
    }
});

canvas.addEventListener('touchstart', () => {
    if (isGameStarted && !isGameOver) {
        horde.jump();
    }
});

drawIdleState();
</script>

</body>
</html>
