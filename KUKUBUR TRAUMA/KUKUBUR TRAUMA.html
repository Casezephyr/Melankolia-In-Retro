<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kukubur Trauma - Extra Large Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            image-rendering: pixelated;
            user-select: none;
        }
        body {
            /* Menggunakan 1 gambar BG.png yang di-zoom/cover tanpa tiling/duplikasi */
            background-color: #2b0938;
            background-image: url('BG.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #ffffff;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            border: 12px solid #3b82f6;
            border-radius: 8px;
            box-shadow: none;
            background: #ff77a8;
            padding: 10px;
        }
        canvas {
            display: block;
            background-color: #f7d380;
            border: 4px solid #1e1035;
            cursor: pointer;
        }

        #top-hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            font-size: 14px;
            text-shadow: 3px 3px 0px #000;
        }

        .hud-panel {
            background: #111;
            padding: 10px 14px;
            border: 3px solid #fff;
            box-shadow: 3px 3px 0 #000;
        }

        #stat-card {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            pointer-events: none;
        }

        .hp-bar-outer {
            width: 160px;
            height: 16px;
            background: #444;
            border: 2px solid #fff;
            padding: 1px;
            margin-top: 4px;
        }

        .hp-bar-inner {
            width: 100%;
            height: 100%;
            background: #ff2a55;
            transition: width 0.1s;
        }

        .stat-box {
            display: inline-block;
            background: #000;
            padding: 4px 8px;
            border: 2px solid #fff;
            color: #00ffcc;
        }

        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(30, 10, 40, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            text-align: center;
            z-index: 20;
        }

        #game-over.active {
            opacity: 1;
            pointer-events: auto;
        }

        #game-over h1 {
            color: #ff0055;
            font-size: 24px;
            text-shadow: 4px 4px 0px #000;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        #game-over p {
            font-size: 12px;
            margin: 8px 0;
            color: #00ffcc;
            text-shadow: 2px 2px 0px #000;
        }

        #game-over button {
            margin-top: 25px;
            padding: 14px 24px;
            background: #ffcc00;
            color: #000;
            border: 4px solid #fff;
            font-family: 'Press Start 2P', monospace;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 4px 4px 0 #000;
        }

        #game-over button:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 #000;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="top-hud">
        <div class="hud-panel">
            <span style="color: #ff77a8;">TRAUMA:</span> 
            <span id="score" class="stat-box">0</span>
        </div>
        <div class="hud-panel">
            <span style="color: #ffcc00;">WAKTU:</span> 
            <span id="timer" class="stat-box" style="color: #ffcc00;">00:00</span>
        </div>
    </div>

    <div id="stat-card" class="hud-panel">
        <div style="text-align: center;">
            <div style="font-size: 8px; color: #aaa; margin-bottom: 4px;">AKU</div>
            <div style="font-size: 10px; color: #38bdf8;">[ BALADA ]</div>
        </div>
        <div>
            <div style="font-size: 8px; color: #fff;">TINGKAT TRAUMA</div>
            <div class="hp-bar-outer">
                <div id="hp-fill" class="hp-bar-inner"></div>
            </div>
        </div>
    </div>

    <div id="game-over">
        <h1>KEPALAMU PECAH<br><span style="font-size: 14px; color: #fff;">TRAUMA MENGHANTUIMU</span></h1>
        <p>DURASI BERTAHAN: <span id="final-time" style="color: #ffcc00;">0</span> DETIK</p>
        <p>TOTAL TRAUMA: <span id="final-score" style="color: #00ffcc;">0</span></p>
        <button onclick="resetGame()">KUBUR LAGI</button>
    </div>

    <!-- Canvas Diperbesar Menjadi 1200x700 -->
    <canvas id="gameCanvas" width="1200" height="700"></canvas>
</div>

<!-- Pemutar Audio BGM -->
<audio id="bgm" loop>
    <source src="BGM.mp3" type="audio/mpeg">
</audio>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const scoreEl = document.getElementById('score');
const timerEl = document.getElementById('timer');
const hpFill = document.getElementById('hp-fill');
const gameOverScreen = document.getElementById('game-over');
const finalTimeEl = document.getElementById('final-time');
const finalScoreEl = document.getElementById('final-score');
const bgm = document.getElementById('bgm');

let gameState = 'START';
let blinkTimer = 0;

const images = {
    player: new Image(),
    enemy: new Image(),
    music: new Image(),
    tv: new Image(),
    cartoon: new Image(),
    logo: new Image()
};

images.player.src = 'BALADADONGKAP.png';
images.enemy.src = 'KARAKTER IBU.png';
images.music.src = 'MUSIK.png';
images.tv.src = 'TELEVISI.png';
images.cartoon.src = 'KARTUN.png';
images.logo.src = 'LOGO.png';

function drawImageProportional(img, x, y, targetWidth, targetHeight, flipX = false) {
    if (!img.complete || img.naturalWidth === 0) return;
    
    const aspect = img.naturalWidth / img.naturalHeight;
    let drawWidth = targetWidth;
    let drawHeight = targetHeight;

    if (targetWidth / targetHeight > aspect) {
        drawWidth = targetHeight * aspect;
    } else {
        drawHeight = targetWidth / aspect;
    }

    const offsetX = x + (targetWidth - drawWidth) / 2;
    const offsetY = y + (targetHeight - drawHeight) / 2;

    ctx.save();
    if (flipX) {
        ctx.translate(Math.floor(offsetX) + Math.floor(drawWidth), Math.floor(offsetY));
        ctx.scale(-1, 1);
        ctx.drawImage(img, 0, 0, Math.floor(drawWidth), Math.floor(drawHeight));
    } else {
        ctx.drawImage(img, Math.floor(offsetX), Math.floor(offsetY), Math.floor(drawWidth), Math.floor(drawHeight));
    }
    ctx.restore();
}

const GRID_SIZE = 50;
const keys = {};
const mouse = { x: 0, y: 0 };

function startGame() {
    if (gameState === 'START') {
        gameState = 'PLAYING';
        startTime = Date.now();
        spawnInterval = setInterval(spawnEnemies, 900);
        obstacleRelocateInterval = setInterval(relocateObstacles, 5000);
        
        // Putar Musik BGM saat game dimulai
        if (bgm.paused) {
            bgm.currentTime = 0;
            bgm.play().catch(e => console.log("Audio play blocked:", e));
        }
    }
}

window.addEventListener('keydown', e => {
    if (gameState === 'START') {
        startGame();
        return;
    }
    keys[e.key.toLowerCase()] = true;
});

window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
});

canvas.addEventListener('click', () => {
    if (gameState === 'START') {
        startGame();
    }
});

let player, enemies, slashes, enemyProjectiles, obstacles, particles, score, startTime, spawnInterval, obstacleRelocateInterval;

function drawGrid() {
    for (let x = 0; x < canvas.width; x += GRID_SIZE) {
        for (let y = 0; y < canvas.height; y += GRID_SIZE) {
            const isEven = ((x / GRID_SIZE) + (y / GRID_SIZE)) % 2 === 0;
            ctx.fillStyle = isEven ? '#fce3a1' : '#f7d380';
            ctx.fillRect(x, y, GRID_SIZE, GRID_SIZE);
            
            ctx.strokeStyle = '#ebd083';
            ctx.lineWidth = 1;
            ctx.strokeRect(x, y, GRID_SIZE, GRID_SIZE);
        }
    }
}

class Obstacle {
    constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.width = 72; // Diperbesar dari 48 ke 72
        this.height = 72;
        this.type = type;
    }

    draw() {
        const img = this.type === 'tv' ? images.tv : images.cartoon;
        drawImageProportional(img, this.x, this.y, this.width, this.height);
    }
}

class Player {
    constructor() {
        this.width = 64; // Diperbesar dari 44 ke 64
        this.height = 64;
        this.x = canvas.width / 2 - this.width / 2;
        this.y = canvas.height / 2 - this.height / 2;
        this.speed = 2.4;
        this.maxHp = 100;
        this.hp = 100;
        this.attackCooldown = 0;
        this.attackSpeed = 16;
        this.angle = 0;
        this.facingLeft = false;
    }

    update() {
        if (gameState !== 'PLAYING') return;

        let dx = 0, dy = 0;

        if (keys['w'] || keys['arrowup']) dy -= 1;
        if (keys['s'] || keys['arrowdown']) dy += 1;
        if (keys['a'] || keys['arrowleft']) {
            dx -= 1;
            this.facingLeft = true;
        }
        if (keys['d'] || keys['arrowright']) {
            dx += 1;
            this.facingLeft = false;
        }

        if (dx !== 0 && dy !== 0) {
            dx *= 0.7071;
            dy *= 0.7071;
        }

        let nextX = this.x + dx * this.speed;
        let nextY = this.y + dy * this.speed;

        nextX = Math.max(10, Math.min(canvas.width - this.width - 10, nextX));
        nextY = Math.max(10, Math.min(canvas.height - this.height - 10, nextY));

        let canMoveX = true, canMoveY = true;
        obstacles.forEach(obs => {
            if (nextX < obs.x + obs.width && nextX + this.width > obs.x &&
                this.y < obs.y + obs.height && this.y + this.height > obs.y) canMoveX = false;
            if (this.x < obs.x + obs.width && this.x + this.width > obs.x &&
                nextY < obs.y + obs.height && nextY + this.height > obs.y) canMoveY = false;
        });

        if (canMoveX) this.x = nextX;
        if (canMoveY) this.y = nextY;

        this.angle = Math.atan2(mouse.y - (this.y + this.height / 2), mouse.x - (this.x + this.width / 2));

        if (this.attackCooldown <= 0) {
            slashes.push(new Slash(this.x + this.width / 2, this.y + this.height / 2, this.angle));
            this.attackCooldown = this.attackSpeed;
        } else {
            this.attackCooldown--;
        }
    }

    draw() {
        drawImageProportional(images.player, this.x, this.y, this.width, this.height, this.facingLeft);

        ctx.strokeStyle = '#00f0ff';
        ctx.lineWidth = 2;
        ctx.strokeRect(Math.floor(mouse.x) - 8, Math.floor(mouse.y) - 8, 16, 16);
    }
}

class Slash {
    constructor(x, y, angle) {
        this.x = x;
        this.y = y;
        this.angle = angle;
        this.radius = 75; // Diperbesar dari 55 ke 75
        this.life = 6;
        this.maxLife = 6;
        this.damage = 30;
    }

    update() {
        this.life--;
    }

    draw() {
        ctx.save();
        ctx.translate(Math.floor(this.x), Math.floor(this.y));
        ctx.rotate(this.angle);

        ctx.beginPath();
        ctx.arc(0, 0, this.radius, -Math.PI / 3, Math.PI / 3);
        ctx.strokeStyle = '#00f0ff';
        ctx.lineWidth = 8;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(0, 0, this.radius - 3, -Math.PI / 3, Math.PI / 3);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.restore();
    }
}

class EnemyProjectile {
    constructor(x, y, angle) {
        this.x = x;
        this.y = y;
        this.size = 28; // Diperbesar dari 20 ke 28
        this.speed = 4.0;
        this.vx = Math.cos(angle) * this.speed;
        this.vy = Math.sin(angle) * this.speed;
        this.bounces = 3;
        this.rotation = 0;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.rotation += 0.2;

        if (this.x <= 10 || this.x + this.size >= canvas.width - 10) {
            this.vx *= -1;
            this.bounces--;
        }
        if (this.y <= 10 || this.y + this.size >= canvas.height - 10) {
            this.vy *= -1;
            this.bounces--;
        }

        obstacles.forEach(obs => {
            if (this.x < obs.x + obs.width && this.x + this.size > obs.x &&
                this.y < obs.y + obs.height && this.y + this.size > obs.y) {
                this.vx *= -1;
                this.vy *= -1;
                this.bounces--;
            }
        });
    }

    draw() {
        ctx.save();
        ctx.translate(Math.floor(this.x), Math.floor(this.y));
        ctx.rotate(this.rotation);
        drawImageProportional(images.music, -this.size / 2, -this.size / 2, this.size, this.size);
        ctx.restore();
    }
}

class Enemy {
    constructor() {
        if (Math.random() < 0.5) {
            this.x = Math.random() < 0.5 ? -40 : canvas.width + 40;
            this.y = Math.random() * canvas.height;
        } else {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() < 0.5 ? -40 : canvas.height + 40;
        }

        this.width = 56; // Diperbesar dari 38 ke 56
        this.height = 56;
        this.speed = 1.2 + Math.random() * 0.6;
        this.hp = 35;
        this.shootCooldown = Math.floor(Math.random() * 60);
    }

    update() {
        const angle = Math.atan2((player.y + player.height / 2) - (this.y + this.height / 2), (player.x + player.width / 2) - (this.x + this.width / 2));
        let vx = Math.cos(angle) * this.speed;
        let vy = Math.sin(angle) * this.speed;

        let nextX = this.x + vx;
        let nextY = this.y + vy;

        obstacles.forEach(obs => {
            if (nextX < obs.x + obs.width && nextX + this.width > obs.x &&
                nextY < obs.y + obs.height && nextY + this.height > obs.y) {
                vx *= -1;
                vy *= -1;
            }
        });

        this.x += vx;
        this.y += vy;

        this.shootCooldown++;
        if (this.shootCooldown >= 100) {
            enemyProjectiles.push(new EnemyProjectile(this.x + this.width / 2, this.y + this.height / 2, angle));
            this.shootCooldown = 0;
        }
    }

    draw() {
        drawImageProportional(images.enemy, this.x, this.y, this.width, this.height);
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.size = Math.floor(Math.random() * 6) + 3;
        this.vx = (Math.random() - 0.5) * 6;
        this.vy = (Math.random() - 0.5) * 6;
        this.life = 15;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life--;
    }

    draw() {
        ctx.fillStyle = this.color;
        ctx.fillRect(Math.floor(this.x), Math.floor(this.y), this.size, this.size);
    }
}

function initObstacles() {
    obstacles = [
        new Obstacle(250, 160, 'tv'),
        new Obstacle(850, 160, 'cartoon'),
        new Obstacle(250, 460, 'cartoon'),
        new Obstacle(850, 460, 'tv')
    ];
}

function relocateObstacles() {
    if (gameState !== 'PLAYING' || !player) return;

    const types = ['tv', 'cartoon', 'cartoon', 'tv'];
    const padding = 80;
    obstacles = [];

    types.forEach(type => {
        let validPos = false;
        let newX, newY;

        while (!validPos) {
            newX = padding + Math.floor(Math.random() * (canvas.width - padding * 2 - 72));
            newY = padding + Math.floor(Math.random() * (canvas.height - padding * 2 - 72));

            const distToPlayer = Math.hypot((player.x + player.width / 2) - (newX + 36), (player.y + player.height / 2) - (newY + 36));

            let overlapOtherObstacle = false;
            obstacles.forEach(obs => {
                if (Math.hypot((obs.x + 36) - (newX + 36), (obs.y + 36) - (newY + 36)) < 90) {
                    overlapOtherObstacle = true;
                }
            });

            if (distToPlayer > 120 && !overlapOtherObstacle) {
                validPos = true;
            }
        }

        for (let i = 0; i < 8; i++) {
            particles.push(new Particle(newX + 36, newY + 36, '#00f0ff'));
        }

        obstacles.push(new Obstacle(newX, newY, type));
    });
}

function spawnEnemies() {
    if (gameState !== 'PLAYING') return;
    const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
    const count = 1 + Math.floor(elapsedSeconds / 8);

    for (let i = 0; i < count; i++) {
        enemies.push(new Enemy());
    }
}

function updateGame() {
    drawGrid();

    obstacles.forEach(obs => obs.draw());

    if (gameState === 'START') {
        ctx.fillStyle = "rgba(10, 10, 25, 0.45)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (images.logo.complete && images.logo.naturalWidth !== 0) {
            const logoWidth = 650;
            const logoScale = logoWidth / images.logo.width;
            const logoHeight = images.logo.height * logoScale;
            let logoX = (canvas.width / 2) - (logoWidth / 2);
            let logoY = 160;
            ctx.drawImage(images.logo, logoX, logoY, logoWidth, logoHeight);
        }

        blinkTimer += 0.04;
        if (Math.sin(blinkTimer) > 0) {
            ctx.fillStyle = "#ffffff";
            ctx.font = "16px 'Press Start 2P', monospace";
            ctx.textAlign = "center";
            ctx.shadowColor = "#000000";
            ctx.shadowBlur = 4;
            ctx.fillText("TEKAN TOMBOL ATAU KLIK UNTUK MEMULAI", canvas.width / 2, 520);
            ctx.shadowBlur = 0;
        }

        player.draw();
        requestAnimationFrame(updateGame);
        return;
    }

    if (gameState === 'PLAYING') {
        player.update();
        player.draw();

        slashes.forEach((slash, sIndex) => {
            slash.update();
            slash.draw();
            if (slash.life <= 0) slashes.splice(sIndex, 1);
        });

        particles.forEach((p, pIndex) => {
            p.update();
            p.draw();
            if (p.life <= 0) particles.splice(pIndex, 1);
        });

        enemyProjectiles.forEach((ep, epIndex) => {
            ep.update();
            ep.draw();

            slashes.forEach(slash => {
                const dist = Math.hypot(slash.x - ep.x, slash.y - ep.y);
                if (dist < slash.radius + ep.size) {
                    ep.vx *= -1.2;
                    ep.vy *= -1.2;
                    for (let i = 0; i < 3; i++) particles.push(new Particle(ep.x, ep.y, '#00f0ff'));
                }
            });

            const distToPlayer = Math.hypot((player.x + player.width / 2) - ep.x, (player.y + player.height / 2) - ep.y);
            if (distToPlayer < player.width / 2 + ep.size / 2) {
                player.hp -= 8;
                hpFill.style.width = Math.max(0, (player.hp / player.maxHp) * 100) + '%';
                enemyProjectiles.splice(epIndex, 1);
                if (player.hp <= 0) endGame();
            }

            if (ep.bounces <= 0) enemyProjectiles.splice(epIndex, 1);
        });

        enemies.forEach((enemy, eIndex) => {
            enemy.update();
            enemy.draw();

            slashes.forEach(slash => {
                const enemyCenterX = enemy.x + enemy.width / 2;
                const enemyCenterY = enemy.y + enemy.height / 2;
                const dist = Math.hypot(slash.x - enemyCenterX, slash.y - enemyCenterY);
                const angleToEnemy = Math.atan2(enemyCenterY - slash.y, enemyCenterX - slash.x);
                let diffAngle = Math.abs(slash.angle - angleToEnemy);
                if (diffAngle > Math.PI) diffAngle = Math.PI * 2 - diffAngle;

                if (dist < slash.radius + enemy.width / 2 && diffAngle < Math.PI / 3) {
                    enemy.hp -= slash.damage;
                    for (let i = 0; i < 4; i++) particles.push(new Particle(enemy.x, enemy.y, '#ff0055'));

                    enemy.x += Math.cos(slash.angle) * 12;
                    enemy.y += Math.sin(slash.angle) * 12;
                }
            });

            if (enemy.hp <= 0) {
                enemies.splice(eIndex, 1);
                score++;
                scoreEl.innerText = score;
                for (let i = 0; i < 6; i++) particles.push(new Particle(enemy.x, enemy.y, '#00ffcc'));
            }

            const distToPlayer = Math.hypot((player.x + player.width / 2) - (enemy.x + enemy.width / 2), (player.y + player.height / 2) - (enemy.y + enemy.height / 2));
            if (distToPlayer < (player.width + enemy.width) / 2) {
                player.hp -= 0.6;
                hpFill.style.width = Math.max(0, (player.hp / player.maxHp) * 100) + '%';
                if (player.hp <= 0) endGame();
            }
        });

        const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
        const mins = String(Math.floor(elapsedSeconds / 60)).padStart(2, '0');
        const secs = String(elapsedSeconds % 60).padStart(2, '0');
        timerEl.innerText = `${mins}:${secs}`;
    }

    requestAnimationFrame(updateGame);
}

function endGame() {
    gameState = 'GAMEOVER';
    clearInterval(spawnInterval);
    clearInterval(obstacleRelocateInterval);
    
    // PEMBARUAN: BGM TIDAK di-pause / dimatikan agar lagu tetap berjalan saat kalah
    
    const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
    finalTimeEl.innerText = elapsedSeconds;
    finalScoreEl.innerText = score;
    gameOverScreen.classList.add('active');
}

function resetGame() {
    player = new Player();
    enemies = [];
    slashes = [];
    enemyProjectiles = [];
    particles = [];
    score = 0;
    gameState = 'START';

    initObstacles();

    scoreEl.innerText = '0';
    timerEl.innerText = '00:00';
    hpFill.style.width = '100%';
    gameOverScreen.classList.remove('active');

    clearInterval(spawnInterval);
    clearInterval(obstacleRelocateInterval);
}

player = new Player();
enemies = [];
slashes = [];
enemyProjectiles = [];
particles = [];
score = 0;
initObstacles();
updateGame();
</script>

</body>
</html>
