<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metafora Berpelukan</title>
    <!-- Font Pixel Art Retro -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-image: url('BG.png');
            background-size: cover;
            background-position: center;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            height: 840px;
            background-image: url('BG.png');
            background-size: cover;
            background-position: center;
            border-radius: 0;
            border: 4px solid #9c27b0;
            overflow: hidden;
            touch-action: none;
            box-sizing: border-box;
        }
        .hud {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border: 2px solid #9c27b0;
        }
        .score {
            font-size: 10px;
            color: #ffffff;
            line-height: 1.4;
            text-align: left;
        }
        .lives-container {
            font-size: 10px;
            color: #ffffff;
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            text-align: right;
        }
        .lives-icons {
            display: flex;
            gap: 4px;
            margin-top: 4px;
            justify-content: flex-end;
        }
        .hud-heart {
            width: 16px;
            height: 16px;
            image-rendering: pixelated;
        }
        .entity {
            position: absolute;
            width: 80px;
            height: 80px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .entity img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
        }
        .entity:active {
            transform: scale(1.08);
        }
        .progress-bar-container {
            position: absolute;
            top: -12px;
            width: 60px;
            height: 8px;
            background-color: #000;
            border-radius: 0;
            overflow: hidden;
            border: 1px solid #fff;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: #00e676;
        }
        .effect-particle {
            position: absolute;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            color: #ff4081;
            font-family: 'Press Start 2P', monospace;
        }
        .effect-heart-img {
            width: 20px;
            height: 20px;
            image-rendering: pixelated;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-30px); }
        }

        /* Overlay Umum */
        .overlay-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            text-align: center;
            padding: 20px;
        }

        /* Start Overlay Tanpa Blur */
        #start-screen {
            background: rgba(10, 10, 25, 0.4); 
            cursor: pointer;
        }

        /* Game Over Overlay Pekat */
        .game-over {
            background: rgba(10, 10, 25, 0.90);
        }

        .logo-img {
            width: 85%;
            max-width: 380px;
            height: auto;
            image-rendering: pixelated;
            margin-bottom: 40px;
            filter: drop-shadow(0px 4px 10px rgba(0, 0, 0, 0.7));
        }

        /* Animasi Kedap Kedip Teks Start Klasik */
        .start-text {
            color: #f5f5f5;
            font-size: 11px;
            line-height: 1.8;
            max-width: 80%;
            text-shadow: 2px 2px #000;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .game-over h2 {
            color: #ff4081;
            font-size: 18px;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .game-over p {
            font-size: 12px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .btn-pixel {
            padding: 14px 24px;
            background: #9c27b0;
            color: #fff;
            border: 2px solid #fff;
            font-size: 11px;
            font-family: 'Press Start 2P', monospace;
            cursor: pointer;
            box-shadow: 0 4px #6a1b9a;
        }
        .btn-pixel:active {
            background: #ff4081;
            color: #fff;
            box-shadow: 0 0 #6a1b9a;
            transform: translateY(4px);
        }
    </style>
</head>
<body>

<!-- Audio Element untuk BGM Loop -->
<audio id="bgm" src="Bgm.mp3" loop></audio>

<div id="game-container">
    <!-- HUD -->
    <div class="hud">
        <div class="score">SKOR:<br><span id="score">0</span></div>
        <div class="lives-container">
            NYAWA:
            <div id="lives-box" class="lives-icons"></div>
        </div>
    </div>
    
    <!-- Start Screen -->
    <div id="start-screen" class="overlay-screen" onclick="startGame()">
        <img src="LOGO.png" alt="Metafora Berpelukan" class="logo-img">
        <div class="start-text">KLIK ATAU TAP UNTUK MEMULAI</div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over" class="overlay-screen game-over" style="display: none;">
        <h2>GAME OVER</h2>
        <p>SKOR AKHIR:<br><br><span id="final-score" style="color: #00e676;">0</span></p>
        <button class="btn-pixel" onclick="backToMenu()">MAIN LAGI</button>
    </div>
</div>

<script>
    const container = document.getElementById('game-container');
    const scoreElement = document.getElementById('score');
    const livesBox = document.getElementById('lives-box');
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over');
    const finalScoreElement = document.getElementById('final-score');
    const bgmAudio = document.getElementById('bgm');

    const characterVariants = [
        { sad: 'K1 SAD.png', happy: 'K1 HAPPY.png' },
        { sad: 'K2 SAD.png', happy: 'K2 HAPPY.png' },
        { sad: 'K3 SAD.png', happy: 'K3 HAPPY.png' },
        { sad: 'K4 SAD.png', happy: 'K4 HAPPY.png' }
    ];

    let score = 0;
    let lives = 3;
    const maxLives = 5;
    let entities = [];
    let spawnTimer = null;
    let activeIntervals = new Map();
    let isGameRunning = false;
    let lastLaneIndex = -1;

    function updateHUD() {
        scoreElement.textContent = score;
        livesBox.innerHTML = '';
        for (let i = 0; i < Math.max(0, lives); i++) {
            const img = document.createElement('img');
            img.src = 'HEART.png';
            img.classList.add('hud-heart');
            livesBox.appendChild(img);
        }
    }

    function startGame() {
        // Memutar BGM jika belum berjalan
        if (bgmAudio.paused) {
            bgmAudio.play().catch(e => console.log("Interaksi dibutuhkan untuk memutar audio:", e));
        }

        if (isGameRunning) return;
        
        startScreen.style.display = 'none';
        gameOverScreen.style.display = 'none';
        
        score = 0;
        lives = 3;
        lastLaneIndex = -1;
        isGameRunning = true;
        updateHUD();

        spawnTimer = setInterval(spawnEntity, 1000);
    }

    function backToMenu() {
        gameOverScreen.style.display = 'none';
        startScreen.style.display = 'flex';
    }

    function spawnEntity() {
        if (!isGameRunning) return;

        const isRocket = Math.random() < 0.25;
        const entityEl = document.createElement('div');
        entityEl.classList.add('entity');

        // Posisi lajur disesuaikan dengan tinggi container 840px
        const lanes = [180, 380, 580];
        
        let selectedLaneIndex;
        do {
            selectedLaneIndex = Math.floor(Math.random() * lanes.length);
        } while (selectedLaneIndex === lastLaneIndex);

        lastLaneIndex = selectedLaneIndex;
        const posY = lanes[selectedLaneIndex];

        const entityData = {
            element: entityEl,
            isRocket: isRocket,
            posX: -90,
            posY: posY,
            speed: Math.random() * 0.8 + 1.2,
            happiness: 0,
            isDone: false
        };

        if (isRocket) {
            entityEl.innerHTML = `<img src="ROCKET.png" alt="Rocket">`;
        } else {
            const variant = characterVariants[Math.floor(Math.random() * characterVariants.length)];
            entityData.variant = variant;
            
            entityEl.innerHTML = `
                <div class="progress-bar-container">
                    <div class="progress-bar"></div>
                </div>
                <img src="${variant.sad}" class="char-img" alt="Character">
            `;
        }

        entityEl.style.top = posY + 'px';
        entityEl.style.left = '-90px';

        const startAction = (e) => handleTouchStart(e, entityData);
        const stopAction = () => handleTouchEnd(entityData);

        entityEl.addEventListener('mousedown', startAction);
        entityEl.addEventListener('mouseup', stopAction);
        entityEl.addEventListener('mouseleave', stopAction);

        entityEl.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startAction(e);
        });
        entityEl.addEventListener('touchend', stopAction);

        container.appendChild(entityEl);
        entities.push(entityData);
    }

    function handleTouchStart(e, data) {
        if (data.isDone || !isGameRunning) return;

        if (data.isRocket) {
            createEffect(data.posX + 40, data.posY + 20, '💥', false);
            removeEntity(data);
            takeDamage();
            return;
        }

        const intervalId = setInterval(() => {
            if (data.happiness < 100 && !data.isDone) {
                data.happiness += 7;
                const bar = data.element.querySelector('.progress-bar');
                if (bar) bar.style.width = Math.min(100, data.happiness) + '%';
                
                createEffect(data.posX + 40, data.posY, '', true);

                if (data.happiness >= 100) {
                    data.isDone = true;
                    
                    const imgEl = data.element.querySelector('.char-img');
                    if (imgEl) imgEl.src = data.variant.happy;

                    score += 1;

                    if (lives < maxLives) {
                        lives += 1;
                        createEffect(data.posX + 40, data.posY - 20, '+1', true);
                    }

                    updateHUD();
                    handleTouchEnd(data);

                    setTimeout(() => {
                        removeEntity(data);
                    }, 600);
                }
            }
        }, 80);

        activeIntervals.set(data, intervalId);
    }

    function handleTouchEnd(data) {
        if (activeIntervals.has(data)) {
            clearInterval(activeIntervals.get(data));
            activeIntervals.delete(data);
        }
    }

    function createEffect(x, y, text, useHeartImage = true) {
        const effect = document.createElement('div');
        effect.classList.add('effect-particle');
        
        if (useHeartImage) {
            const img = document.createElement('img');
            img.src = 'HEART.png';
            img.classList.add('effect-heart-img');
            effect.appendChild(img);
        }

        if (text) {
            const span = document.createElement('span');
            span.textContent = text;
            effect.appendChild(span);
        }

        effect.style.left = x + 'px';
        effect.style.top = y + 'px';
        container.appendChild(effect);
        setTimeout(() => effect.remove(), 800);
    }

    function removeEntity(data) {
        handleTouchEnd(data);
        data.element.remove();
        entities = entities.filter(e => e !== data);
    }

    function takeDamage() {
        lives -= 1;
        updateHUD();
        if (lives <= 0) {
            endGame();
        }
    }

    function endGame() {
        isGameRunning = false;
        clearInterval(spawnTimer);
        
        entities.forEach(e => e.element.remove());
        entities = [];

        finalScoreElement.textContent = score;
        gameOverScreen.style.display = 'flex';
    }

    function gameLoop() {
        if (isGameRunning) {
            entities.forEach(data => {
                if (!activeIntervals.has(data) && !data.isDone) {
                    data.posX += data.speed;
                    data.element.style.left = data.posX + 'px';

                    // Batas kanan disesuaikan dengan lebar baru 640px
                    if (data.posX > 640) {
                        if (!data.isRocket) {
                            takeDamage();
                        }
                        removeEntity(data);
                    }
                }
            });
        }
        requestAnimationFrame(gameLoop);
    }

    updateHUD();
    gameLoop();
</script>

</body>
</html>
